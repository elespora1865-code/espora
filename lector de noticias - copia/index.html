<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar de Noticias RSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>📡 Radar de Noticias</h1>
        <p>Tu agregador de información en tiempo real</p>
        
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Buscar noticias...">
            <div class="filters">
                <button class="filter-btn active" data-category="all">Todas</button>
                <button class="filter-btn" data-category="patagonia">Patagonia</button>
                <button class="filter-btn" data-category="nacional">Nacional</button>
                <button class="filter-btn" data-category="geopolitica">Internacional</button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Aquí es donde JavaScript inyectará las tarjetas de noticias -->
        <div id="news-container" class="news-grid">
            <p class="loading">Cargando las últimas noticias...</p>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
